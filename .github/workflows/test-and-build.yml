name: Test and build plugin

# Only ever runs on a push: to main, to a release tag, or to a pull request
# branch. There is deliberately no `schedule:` trigger, so nothing fires on its
# own timer.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test server and plugin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the mcp package requires.
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show resolved mcp version
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Event file pruning test
        run: node tests/test_event_pruning.js

      - name: End-to-end test
        # Drives the real plugin.js scripts through a replica of Super
        # Productivity's plugin sandbox, against the real MCP server. Runs in a
        # throwaway HOME, so no Super Productivity install is needed or touched.
        run: python tests/test_e2e.py

  build:
    name: Build plugin.zip
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and validate
        # On a tag, the manifest version must match it.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export EXPECT_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Tag build, expecting manifest version ${EXPECT_VERSION}"
          fi
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: plugin.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin.zip
          generate_release_notes: true
